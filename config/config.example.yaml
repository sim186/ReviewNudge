# ReviewNudge configuration.
#
# Copy this file to config/config.yaml and edit it. This file holds infrastructure
# and secrets only — it is never written by the application. Day-to-day settings
# (exclusions, snoozes, the pause switch) are edited in the admin panel and stored
# in SQLite; the values here act as the defaults those overrides sit on top of.
#
# ${VAR} reads an environment variable; ${VAR:-fallback} supplies a default.
# Keep secrets in .env, not here.

gitlab:
  url: https://gitlab.example.com
  # Personal access token with the read_api scope. The token's user also needs at
  # least the Reporter role on private projects — Guest cannot see merge requests
  # there, and the symptom is an empty scan rather than an error. See the README.
  token: ${GITLAB_TOKEN}
  groups: # full paths; subgroups are included
    - engineering
    - platform/infra
  include_subgroups: true
  timeout_ms: 30000
  page_size: 50
  max_retries: 4

admin:
  enabled: true
  # Loopback by default so exposing the panel is a deliberate act. In Docker set
  # NUDGE_ADMIN_HOST=0.0.0.0 and publish the port to 127.0.0.1 on the host instead.
  host: ${NUDGE_ADMIN_HOST:-127.0.0.1}
  port: 8080
  # Public URL used in recipient emails when the panel is behind a reverse proxy.
  # Leave unset when the panel is not reachable by recipients.
  public_url: https://nudge.example.com
  password: ${NUDGE_ADMIN_PASSWORD}
  session_secret: ${NUDGE_SESSION_SECRET:-} # random per start if left empty
  session_ttl_hours: 12

schedule:
  cron: '0 9 * * 1-5' # 09:00, Monday to Friday
  timezone: Europe/Zurich
  run_on_start: false

# Defaults for the "waiting for their input" rules. Overridable in the panel.
rules:
  reviewer_not_approved: true # user is a reviewer and has not approved
  assignee_action_pending: true # user is an assignee and something needs them
  unresolved_threads: true # unresolved threads they opened or were mentioned in
  require_activity_since_push: true # skip people who already acted since the last push
  min_age_hours: 12 # ignore merge requests younger than this
  ignore_draft: true

  # Warnings describe the merge request rather than a person. They render as a box on
  # rows people already receive, so they add no extra messages. Drafts are never warned
  # about.
  warn_missing_reviewer: true # non-draft merge request with no reviewer assigned
  warn_missing_ticket: false # no issue key in the title or the description
  ticket_pattern: '[A-Z][A-Z0-9]+-\d+' # case-insensitive; matches Jira-style PROJ-1234
  # A merge request nobody is waiting on appears in nobody's digest. This sends its
  # warnings to the author so it does not sit unnoticed forever.
  notify_author_of_warnings: true

# Defaults for exclusions. The panel adds to these; it never edits this file.
exclude:
  projects: # glob patterns matched against the full project path
    - 'sandbox/**'
    - 'archive/legacy-tool'
  mr_labels: # merge requests carrying any of these are skipped
    - wip
    - blocked
    - on-hold
  users: # never notified, and never counted as blocking
    - renovate-bot
    - gitlab-ci
  bots: true # skip GitLab bot and project-bot accounts

# Defaults for silencing. See the README for the precedence order.
silence:
  enabled: false # global pause; also togglable in the panel and via NUDGE_SILENCE=1
  quiet_hours: # no delivery outside working hours; null disables the check
    start: '18:00'
    end: '08:00'
  working_days: [mon, tue, wed, thu, fri]
  holidays:
    - '2026-12-25'
    - '2026-12-26'
  muted_merge_requests: [] # full merge request URLs

notifications:
  channels: [email, teams] # add slack and/or telegram to enable those too
  max_items_per_digest: 25
  skip_empty: true # send nothing to people with an empty digest

email:
  smtp:
    host: smtp.example.com
    port: 587
    secure: false # true for implicit TLS on port 465
    user: review-nudge
    pass: ${SMTP_PASS}
    reject_unauthorized: true # set false only for a self-signed internal relay
  from: ReviewNudge <review-nudge@example.com>
  subject_template: '{count} merge requests are waiting for you'

teams:
  # Power Automate flow using the "When a Teams webhook request is received"
  # trigger. See README for the flow setup — Office 365 connectors were retired
  # in April 2026 and no longer work.
  workflow_url: ${TEAMS_WORKFLOW_URL}
  timeout_ms: 15000

# Uncomment, and add "slack" to notifications.channels, to deliver over Slack.
# Uses chat.postMessage with a bot token rather than an incoming webhook, because
# webhooks are tied to one channel and cannot open a direct message.
# slack:
#   bot_token: ${SLACK_BOT_TOKEN} # xoxb-…, needs the chat:write scope
#   api_url: https://slack.com/api
#   timeout_ms: 15000

# Uncomment, and add "telegram" to notifications.channels, to deliver over Telegram.
# Each person must message the bot once before they have a chat ID.
# telegram:
#   bot_token: ${TELEGRAM_BOT_TOKEN} # from @BotFather
#   api_url: https://api.telegram.org
#   timeout_ms: 15000
#   disable_notification: false # true delivers without the notification ping

# Seed list mapping GitLab usernames to delivery addresses. After the first start
# these are managed in the admin panel; entries here act as defaults. People who
# appear on merge requests but are missing from this list are skipped and shown at
# the top of the panel's Recipients page.
recipients:
  - gitlab_username: alice
    email: alice@example.com
    teams_upn: alice@example.com
    slack_id: U012ABCDEF # Slack profile → More → Copy member ID
    telegram_chat_id: '987654321'
    channels: [email, teams] # omit to use notifications.channels
  - gitlab_username: bob
    email: bob@example.com

retention:
  audit_days: 180
  run_days: 90
